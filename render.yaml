services:
  - type: worker
    name: wikifx-broker-check-india-bot
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_THINKING
        value: disabled
      - key: DEEPSEEK_TIMEOUT_SECONDS
        value: "30"
      - key: AI_MAX_TOKENS
        value: "700"
      - key: BOT_MARKET
        value: India
      - key: SOURCE_TAG
        value: india_own_group_mvp
      - key: RETENTION_DAYS
        value: "30"
      - key: RECALL_AFTER_DAYS
        value: "3"
      - key: RECALL_REPEAT_DAYS
        value: "7"
      - key: RECALL_CHECK_SECONDS
        value: "21600"
      - key: BOT_DB_PATH
        value: /data/telegram_mvp.db
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: telegram-data
      mountPath: /data
      sizeGB: 1
